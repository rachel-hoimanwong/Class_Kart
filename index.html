<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3C 賽車場：開放地圖</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ============================================================
   1. 全域設定
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
* { box-sizing: border-box; }
body {
  font-family: 'Noto Sans TC', sans-serif;
  margin: 0;
  overflow: hidden;
  background: #0f172a;
  color: #fff;
  -webkit-tap-highlight-color: transparent;
}

/* ============================================================
   2. 地圖視窗
   ============================================================ */
#mapViewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(180deg, #87ceeb 0%, #c9e4f0 40%, #a8d5a2 100%);
  cursor: grab;
}
#mapViewport:active { cursor: grabbing; }

/* ============================================================
   3. 地圖內層
   ============================================================ */
#mapWorld {
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  will-change: transform;
  transition: transform 0.1s linear;  /* 拖動時要快，唔好太慢 */
}

/* ============================================================
   4. 地形帶
   ============================================================ */
.terrain-band {
  position: absolute;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  opacity: 0.35;
  pointer-events: none;
  user-select: none;
}

/* ============================================================
   5. 裝飾物
   ============================================================ */
.deco {
  position: absolute;
  font-size: 2rem;
  pointer-events: none;
  user-select: none;
  animation: float 4s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

/* ============================================================
   6. 賽車
   ============================================================ */
.racer {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 2rem;
  transition: left 0.8s cubic-bezier(0.34,1.56,0.64,1),
              top 0.8s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 20;
  cursor: pointer;
  filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
}
.racer .label {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  font-weight: 900;
  white-space: nowrap;
  background: rgba(0,0,0,0.6);
  padding: 1px 5px;
  border-radius: 6px;
  margin-top: 2px;
  color: #fff;
}
.racer.leader .label { background: #ffd700; color: #000; }
.racer.hit {
  animation: hitShake 0.4s infinite;
  filter: drop-shadow(0 0 8px #ef4444);
}
@keyframes hitShake {
  0%, 100% { transform: translate(-50%,-50%) rotate(-8deg); }
  50%      { transform: translate(-50%,-50%) rotate(8deg); }
}

/* ============================================================
   7. HUD
   ============================================================ */
#hud {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15,23,42,0.8);
  border: 2px solid #00e5ff;
  border-radius: 14px;
  padding: 8px 16px;
  font-size: 0.8rem;
  z-index: 100;
  display: flex;
  gap: 14px;
  box-shadow: 0 0 20px rgba(0,229,255,0.4);
  backdrop-filter: blur(6px);
  white-space: nowrap;
}
#hud b { color: #ffd700; }

/* ============================================================
   8. 圖例
   ============================================================ */
#legend {
  position: fixed;
  bottom: 12px;
  left: 12px;
  background: rgba(15,23,42,0.8);
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 0.7rem;
  z-index: 100;
  line-height: 1.7;
  backdrop-filter: blur(6px);
}
#legend a { color: #00e5ff; text-decoration: none; }

/* ============================================================
   9. 更新按鈕
   ============================================================ */
#refreshBtn {
  position: fixed;
  bottom: 14px;
  right: 14px;
  padding: 12px 20px;
  background: #00e5ff;
  color: #000;
  border: none;
  border-radius: 50px;
  font-weight: 900;
  font-size: 0.9rem;
  font-family: 'Noto Sans TC', sans-serif;
  box-shadow: 0 0 20px #00e5ff;
  cursor: pointer;
  z-index: 999999;
}
#refreshBtn:active { transform: scale(0.92); }

/* ============================================================
   10. 中招 Modal
   ============================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal-content {
  background: linear-gradient(135deg,#1e293b,#0f172a);
  border: 3px solid #ffd700;
  border-radius: 20px;
  padding: 26px;
  max-width: 520px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 50px rgba(255,215,0,0.6);
  animation: popIn 0.4s ease-out;
  max-height: 90vh;
  overflow-y: auto;
}
@keyframes popIn {
  from { transform: scale(0.6); opacity: 0; }
  to   { transform: scale(1);   opacity: 1; }
}
.punishment-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin: 16px 0;
  max-height: 280px;
  overflow-y: auto;
  padding: 8px;
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
}
.punishment-item {
  font-size: 0.72rem;
  padding: 6px 8px;
  background: rgba(30,41,59,0.8);
  border-radius: 6px;
  border: 1px solid #334155;
  text-align: left;
  color: #cbd5e1;
}
.punishment-item.locked { opacity: 0.3; text-decoration: line-through; }
.open-btn {
  font-size: 1.2rem;
  font-weight: 900;
  padding: 16px 36px;
  border: none;
  border-radius: 50px;
  background: linear-gradient(135deg,#ffd700,#ffed4e);
  color: #000;
  cursor: pointer;
  box-shadow: 0 0 30px #ffd700;
  font-family: 'Noto Sans TC', sans-serif;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.05); }
}
.close-btn {
  margin-top: 14px;
  padding: 10px 26px;
  background: #334155;
  color: #cbd5e1;
  border: none;
  border-radius: 25px;
  font-size: 0.9rem;
  cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif;
}

/* ============================================================
   11. 診斷面板（測試用）
   ============================================================ */
#racerDebugPanel {
  position: fixed;
  bottom: 200px;       /* 改高，避免同 refreshBtn / debugToggle 重疊 */
  right: 14px;
  background: rgba(0,0,0,0.85);
  border: 1px solid #00e5ff;
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 10px;
  color: #0f0;
  z-index: 999998;
  max-height: 40vh;
  overflow-y: auto;
  font-family: monospace;
  line-height: 1.5;
  min-width: 200px;
}
#debugToggle {
  position: fixed;
  bottom: 140px;
  right: 14px;
  padding: 8px 12px;
  background: #00e5ff;
  color: #000;
  border: none;
  border-radius: 6px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  z-index: 999999;
  pointer-events: auto;
  display: none;
}
</style>
</head>

<body>

<div id="mapViewport">
  <div id="mapWorld"></div>
</div>

<div id="hud">
  <span>🏁 領先：<b id="hudLeader">—</b></span>
  <span>📏 顯示：<b id="hudRange">—</b></span>
</div>

<div id="legend">
  🌿 草原　🌲 森林　🌋 火山　❄️ 雪山　🏰 城堡<br>
  每 1 分 = 10 步 ｜ 扣分 = 後退<br>
  <a href="admin.html">🔧 老師後台</a>
</div>

<button id="refreshBtn" onclick="fetchStudents()">🔄 更新</button>
<button id="debugToggle" onclick="toggleDebugPanel()">🔍 診斷</button>

<div class="modal-overlay" id="hitModal">
  <div class="modal-content">
    <h2 style="font-size:1.6rem;font-weight:900;color:#ffd700;margin-bottom:6px;">💥 中招！</h2>
    <p id="hitStudentName" style="font-size:1.1rem;font-weight:bold;margin-bottom:14px;">學生名稱</p>
    <p style="font-size:0.8rem;color:#94a3b8;margin-bottom:10px;">今日淨分為負，抽取懲罰：</p>
    <div class="punishment-list" id="punishmentList"></div>
    <button class="open-btn" id="openHitBtn" onclick="drawHitPunishment()">🎁 抽懲罰 🎁</button>
    <div id="hitResult" style="display:none;margin-top:16px;font-size:1.1rem;font-weight:900;color:#ffd700;padding:16px;background:rgba(255,215,0,0.1);border:2px solid #ffd700;border-radius:12px;"></div>
    <button class="close-btn" onclick="closeHitModal()">關閉</button>
  </div>
</div>

<script>
/* ============================================================
   A. 全域設定
   ============================================================ */

// ★★★ 呢條要同 admin.html 一樣！ ★★★
const API_URL = 'https://script.google.com/macros/s/AKfycbyYVj27sGs8M_RitHbWM-kMLUq0to4lai3S40O6Qt4Wd4Wt7gJqGGlZ7ZPYbNgW8DTC/exec';

const EXCLUDED_IDS = ['16'];
const STEPS_PER_POINT = 10;
const BUFFER_BEHIND = 10;
const BUFFER_AHEAD  = 15;
const PIXELS_PER_STEP = 30;

const TERRAINS = [
  { name: '草原', from: -Infinity, to: 200,      color: '#7ec850' },
  { name: '森林', from: 200,       to: 500,      color: '#2d5a3d' },
  { name: '火山', from: 500,       to: 900,      color: '#5a2d2d' },
  { name: '雪山', from: 900,       to: 1300,     color: '#dbeafe' },
  { name: '城堡', from: 1300,      to: Infinity, color: '#ffd700' },
];

const CAR_EMOJIS = ['🏎️','🚗','🚙','🚕','🚌','🚐','🚑','🚒','🚓','🚚','🚛','🚜','🛻','🚔','🚘','🚖'];

/* ============================================================
   B. 全域變數
   ============================================================ */
let students = [];
let mapOffsetX = 0;
let currentZoom = 1;
let minStepGlobal = 0;
let maxStepGlobal = 0;
let currentHitStudent = null;
let debugVisible = false;

// 拖動狀態
let isDragging = false;
let dragStartX = 0;
let dragStartOffset = 0;

/* ============================================================
   C. 工具函式
   ============================================================ */
function getTerrain(step) {
  for (const t of TERRAINS) {
    if (step >= t.from && step < t.to) return t;
  }
  return TERRAINS[TERRAINS.length - 1];
}

function getStudentStep(s) {
  return Math.max(0, (s.total_exp || 0) * STEPS_PER_POINT);
}

/* ============================================================
   D. 抓資料
   ============================================================ */
async function fetchStudents() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    console.log('=== API 回傳 ===');
    console.log('筆數:', data.length);
    console.log('所有 id:', data.map(s => s.id));
    console.log('第一筆:', data[0]);

    students = data.filter(s => {
      const sid = String(s.id || '').trim();
      return sid !== '16' && sid !== '16.0';
    });

    console.log('過濾後學生數:', students.length);

    document.getElementById('debugToggle').style.display = 'block';
    renderMap();
  } catch (err) {
    console.error('讀取失敗：', err);
    if (students.length === 0) {
      students = [
        { id:'01', name:'陳俊揚', total_exp:12, today_score:0,  repair_stage:0 },
        { id:'02', name:'蔡尚熙', total_exp:8,  today_score:-2, repair_stage:0 },
        { id:'03', name:'何樂遙', total_exp:20, today_score:0,  repair_stage:0 },
        { id:'04', name:'劉晉廷', total_exp:5,  today_score:0,  repair_stage:0 },
        { id:'05', name:'李嘉興', total_exp:15, today_score:0,  repair_stage:0 },
        { id:'06', name:'李松謙', total_exp:3,  today_score:-1, repair_stage:0 },
        { id:'07', name:'李觀霖', total_exp:18, today_score:0,  repair_stage:0 },
        { id:'08', name:'李永耀', total_exp:10, today_score:0,  repair_stage:0 },
        { id:'09', name:'區啟勝', total_exp:7,  today_score:0,  repair_stage:0 },
        { id:'10', name:'潘寶文', total_exp:22, today_score:0,  repair_stage:0 },
        { id:'12', name:'布浩賢', total_exp:1,  today_score:0,  repair_stage:0 },
        { id:'13', name:'岑嘉謙', total_exp:14, today_score:0,  repair_stage:0 },
        { id:'14', name:'曾灝堯', total_exp:9,  today_score:0,  repair_stage:0 },
        { id:'15', name:'屈允楠', total_exp:6,  today_score:0,  repair_stage:0 },
        { id:'17', name:'楊皓軒', total_exp:11, today_score:0,  repair_stage:0 },
      ];
      document.getElementById('debugToggle').style.display = 'block';
      renderMap();
    }
  }
}

/* ============================================================
   E. 渲染地圖
   ============================================================ */
function renderMap() {
  const world = document.getElementById('mapWorld');
  world.innerHTML = '';
  if (students.length === 0) return;

  const steps = students.map(getStudentStep);
  minStepGlobal = Math.min(...steps);
  maxStepGlobal = Math.max(...steps);

  const viewMin  = Math.max(0, minStepGlobal - BUFFER_BEHIND);
  const viewMax  = maxStepGlobal + BUFFER_AHEAD;
  const viewRange = Math.max(1, viewMax - viewMin);

  const viewportW = window.innerWidth;
  const worldWidth = Math.max(
    viewRange * PIXELS_PER_STEP + 400,
    viewportW + 200
  );
  world.style.width = worldWidth + 'px';

  // 地形帶
  TERRAINS.forEach(t => {
    const fromPx = Math.max(0, (t.from - viewMin) * PIXELS_PER_STEP);
    const toPx   = Math.min(worldWidth, (t.to - viewMin) * PIXELS_PER_STEP);
    if (toPx <= fromPx) return;
    const band = document.createElement('div');
    band.className = 'terrain-band';
    band.style.left = fromPx + 'px';
    band.style.width = (toPx - fromPx) + 'px';
    band.style.background = t.color;
    world.appendChild(band);
  });

  // 裝飾物
  const decoCount = Math.floor(worldWidth / 40);
  for (let i = 0; i < decoCount; i++) {
    const px = i * 40 + Math.random() * 30;
    const stepAtPx = viewMin + px / PIXELS_PER_STEP;
    const terrain = getTerrain(stepAtPx);
    const deco = document.createElement('div');
    deco.className = 'deco';
    deco.style.left = px + 'px';
    deco.style.top = (15 + Math.random() * 70) + '%';
    deco.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
    deco.style.animationDelay = (Math.random() * 4) + 's';
    if (terrain.name === '草原')      deco.textContent = ['🌿','🌸','🌳','🪨'][Math.floor(Math.random()*4)];
    else if (terrain.name === '森林') deco.textContent = ['🌲','🌳','🍄','🪵'][Math.floor(Math.random()*4)];
    else if (terrain.name === '火山') deco.textContent = ['🌋','🔥','🪨','💀'][Math.floor(Math.random()*4)];
    else if (terrain.name === '雪山') deco.textContent = ['❄️','🏔️','⛄','🧊'][Math.floor(Math.random()*4)];
    else                              deco.textContent = ['🏰','⛩️','👑','✨'][Math.floor(Math.random()*4)];
    world.appendChild(deco);
  }

  // 起點線
  const startLine = document.createElement('div');
  startLine.style.cssText = `
    position:absolute; left:0; top:0; width:6px; height:100%;
    background:repeating-linear-gradient(0deg,#fff 0 12px,#000 12px 24px);
    opacity:0.7; z-index:5;
  `;
  world.appendChild(startLine);

  // 賽車
  const leaderExp = Math.max(...students.map(s => s.total_exp));
  students.forEach((s, idx) => {
    const step = getStudentStep(s);
    const xPx = (step - viewMin) * PIXELS_PER_STEP + 20;
    const yPercent = 20 + (idx % 5) * 14;

    const racer = document.createElement('div');
    racer.className = 'racer';
    if (s.total_exp === leaderExp && leaderExp > 0) racer.classList.add('leader');
    if ((s.today_score || 0) < 0) racer.classList.add('hit');
    racer.style.left = xPx + 'px';
    racer.style.top  = yPercent + '%';
    racer.dataset.id = s.id;
    racer.innerHTML = `
      <span style="font-size:1.8rem;">${CAR_EMOJIS[idx % CAR_EMOJIS.length]}</span>
      <div class="label">${s.id} ${s.name}</div>
    `;
    racer.onclick = (e) => { e.stopPropagation(); openHitModal(s); };
    world.appendChild(racer);
  });

  // HUD
  const leader = students.reduce((a,b) => (a.total_exp > b.total_exp ? a : b));
  document.getElementById('hudLeader').textContent =
    `${leader.id} ${leader.name}（${leader.total_exp * STEPS_PER_POINT} 步）`;

  // 縮放 + 置中
  focusOnAll(viewMin, viewRange, worldWidth);

  // 診斷
  if (debugVisible) showRacerDebugPanel(viewMin, viewMax);
}

/* ============================================================
   F. 縮放 + 置中
   ============================================================ */
function focusOnAll(viewMin, viewRange, worldWidth) {
  const viewportW = window.innerWidth;
  const world = document.getElementById('mapWorld');

  const contentWidth = viewRange * PIXELS_PER_STEP + 40;

  let zoom = 1;
  if (contentWidth > viewportW) {
    zoom = viewportW / contentWidth;
  }
  zoom = Math.max(zoom, 0.5);
  currentZoom = zoom;

  const scaledWidth = worldWidth * zoom;
  let offsetX;

  if (scaledWidth <= viewportW) {
    offsetX = (viewportW - scaledWidth) / 2;
  } else {
    const leader = students.reduce((a,b) => (a.total_exp > b.total_exp ? a : b));
    const leaderX = (getStudentStep(leader) - viewMin) * PIXELS_PER_STEP + 20;
    offsetX = viewportW * 0.85 - leaderX * zoom;
    offsetX = Math.min(0, Math.max(viewportW - scaledWidth, offsetX));
  }

  mapOffsetX = offsetX;
  applyTransform();

  document.getElementById('hudRange').textContent =
    `${viewMin} ~ ${viewMax} 步（縮放 ${(zoom*100).toFixed(0)}%）`;
}

/* ============================================================
   F2. 套用 transform
   ============================================================ */
function applyTransform() {
  const world = document.getElementById('mapWorld');
  world.style.transform = `translateX(${mapOffsetX}px) scale(${currentZoom})`;
  world.style.transformOrigin = 'left center';
}

/* ============================================================
   G. 拖動地圖（新增！）
   ============================================================ */
const viewport = document.getElementById('mapViewport');

function startDrag(clientX) {
  isDragging = true;
  dragStartX = clientX;
  dragStartOffset = mapOffsetX;
  document.getElementById('mapWorld').style.transition = 'none'; // 拖動時取消過渡
}

function moveDrag(clientX) {
  if (!isDragging) return;
  const dx = clientX - dragStartX;
  mapOffsetX = dragStartOffset + dx;
  // 限制範圍
  const world = document.getElementById('mapWorld');
  const worldWidth = parseFloat(world.style.width) * currentZoom;
  const viewportW = window.innerWidth;
  const minOffset = Math.min(0, viewportW - worldWidth);
  mapOffsetX = Math.max(minOffset, Math.min(0, mapOffsetX));
  applyTransform();
}

function endDrag() {
  if (!isDragging) return;
  isDragging = false;
  document.getElementById('mapWorld').style.transition = 'transform 0.3s ease-out';
}

// 滑鼠事件
viewport.addEventListener('mousedown', (e) => {
  if (e.target.classList.contains('racer')) return; // 點賽車唔拖
  startDrag(e.clientX);
});
window.addEventListener('mousemove', (e) => moveDrag(e.clientX));
window.addEventListener('mouseup', endDrag);

// 觸控事件
viewport.addEventListener('touchstart', (e) => {
  if (e.target.classList.contains('racer')) return;
  startDrag(e.touches[0].clientX);
}, { passive: true });
viewport.addEventListener('touchmove', (e) => {
  moveDrag(e.touches[0].clientX);
}, { passive: true });
viewport.addEventListener('touchend', endDrag);

/* ============================================================
   H. 診斷面板
   ============================================================ */
function toggleDebugPanel() {
  debugVisible = !debugVisible;
  if (debugVisible) {
    if (students.length > 0) renderMap();
  } else {
    const panel = document.getElementById('racerDebugPanel');
    if (panel) panel.remove();
  }
  document.getElementById('debugToggle').textContent = debugVisible ? '❌ 關閉診斷' : '🔍 診斷';
}

function showRacerDebugPanel(viewMin, viewMax) {
  const old = document.getElementById('racerDebugPanel');
  if (old) old.remove();
  const panel = document.createElement('div');
  panel.id = 'racerDebugPanel';
  let html = `<b style="color:#00e5ff;">🔍 賽車診斷（${students.length} 架）</b><br>`;
  html += `範圍：${viewMin} ~ ${viewMax} 步<br><hr style="border-color:#333;margin:4px 0;">`;
  students.forEach((s, idx) => {
    const step = getStudentStep(s);
    const xPx = (step - viewMin) * PIXELS_PER_STEP + 20;
    const yPercent = 20 + (idx % 5) * 14;
    html += `
      <div style="margin-bottom:3px;">
        <span style="color:#ffd700;">${s.id}</span>
        ${s.name}
        <span style="color:#00e5ff;">${step}步</span>
        <span style="color:#999;">x:${Math.round(xPx)} y:${yPercent}%</span>
      </div>
    `;
  });
  panel.innerHTML = html;
  document.body.appendChild(panel);
}

/* ============================================================
   I. 中招 Modal
   ============================================================ */
function openHitModal(student) {
  if ((student.today_score || 0) >= 0) {
    alert(`${student.name}\n今日淨分：${student.today_score || 0}\n（未中招，無需抽懲罰）`);
    return;
  }
  currentHitStudent = student;
  document.getElementById('hitStudentName').textContent =
    `${student.id}. ${student.name}　今日淨分：${student.today_score}`;
  document.getElementById('hitResult').style.display = 'none';
  document.getElementById('openHitBtn').style.display = 'inline-block';
  renderPunishmentList(Math.abs(student.today_score));
  document.getElementById('hitModal').classList.add('active');
}

function closeHitModal() {
  document.getElementById('hitModal').classList.remove('active');
  currentHitStudent = null;
}

function renderPunishmentList(absScore) {
  const list = document.getElementById('punishmentList');
  list.innerHTML = '';
  const punishments = [
    { id:1,  text:'20 下掌上壓 🧎🏻',               unlock:0 },
    { id:2,  text:'30 下波比跳 🕴🏻',               unlock:3 },
    { id:3,  text:'清潔班房地板和黑板 🧹',          unlock:0 },
    { id:4,  text:'清潔樓層地板和班房窗 🧹🪟',      unlock:0 },
    { id:5,  text:'罰抄學生約章一次 📜',            unlock:3 },
    { id:6,  text:'下星期二四沒有小息和午息',       unlock:3 },
    { id:7,  text:'下星期一三五沒有小息和午息',     unlock:5 },
    { id:8,  text:'抄寫鮑思高神父生平 📓',          unlock:5 },
    { id:9,  text:'放學 T34 室休息半個鐘 🤡',       unlock:3 },
    { id:10, text:'放學 T34 室休息 45 分鐘 🤡',     unlock:5 },
    { id:11, text:'耶穌愛您，豁免一次 🙏',          unlock:0 },
    { id:12, text:'在班上唱一首歌 🎤',              unlock:0 },
    { id:13, text:'在班上跳一隻舞 🕺🏼',             unlock:0 },
    { id:14, text:'讀一篇文章 🗣️',                  unlock:0 },
    { id:15, text:'繪畫校徽兩個 🖍️',                unlock:0 },
    { id:16, text:'帶領祈禱一次（聖三光榮經）🙏🏻',   unlock:0 },
    { id:17, text:'做一條數學題 唔用計數機 📵',      unlock:0 },
  ];
  punishments.forEach(p => {
    const item = document.createElement('div');
    const unlocked = absScore >= p.unlock;
    item.className = 'punishment-item' + (unlocked ? '' : ' locked');
    item.textContent = p.text;
    list.appendChild(item);
  });
}

function drawHitPunishment() {
  if (!currentHitStudent) return;
  const absScore = Math.abs(currentHitStudent.today_score);
  const pool = [
    { id:1,  w:25 }, { id:2,  w:25 }, { id:3,  w:20 }, { id:4,  w:20 },
    { id:11, w:0.1 },{ id:12, w:20 }, { id:13, w:20 }, { id:14, w:25 },
    { id:15, w:25 }, { id:16, w:25 }, { id:17, w:25 },
  ];
  if (absScore >= 3) pool.push({ id:5,w:12 },{ id:6,w:8 },{ id:8,w:10 },{ id:9,w:11 });
  if (absScore >= 5) pool.push({ id:7,w:26 },{ id:10,w:26 });
  const total = pool.reduce((s,p) => s + p.w, 0);
  let r = Math.random() * total;
  let picked = pool[0].id;
  for (const p of pool) {
    r -= p.w;
    if (r <= 0) { picked = p.id; break; }
  }
  const texts = {
    1:'20 下掌上壓 🧎🏻', 2:'30 下波比跳 🕴🏻', 3:'清潔班房地板和黑板 🧹',
    4:'清潔樓層地板和班房窗 🧹🪟', 5:'罰抄學生約章一次 📜', 6:'下星期二四沒有小息和午息',
    7:'下星期一三五沒有小息和午息', 8:'抄寫鮑思高神父生平 📓', 9:'放學 T34 室休息半個鐘 🤡',
    10:'放學 T34 室休息 45 分鐘 🤡', 11:'耶穌愛您，豁免一次 🙏', 12:'在班上唱一首歌 🎤',
    13:'在班上跳一隻舞 🕺🏼', 14:'讀一篇文章 🗣️', 15:'繪畫校徽兩個 🖍️', 16:'帶領祈禱一次（聖三光榮經）🙏🏻',
    17:'做一條數學題 唔用計數機 📵',
  };
  document.getElementById('openHitBtn').style.display = 'none';
  const result = document.getElementById('hitResult');
  result.style.display = 'block';
  result.textContent = '🎉 抽中：' + texts[picked];
}
